<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>అమ్మమ్మ పచ్చళ్ళు - రిజిస్ట్రేషన్</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; color: #333; }
    header { background-color: #b71c1c; color: white; padding: 15px; text-align: center; }
    .container { max-width: 500px; margin: 30px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { color: #b71c1c; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #b71c1c; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #880e4f; }
  </style>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <h1>🌶️ అమ్మమ్మ పచ్చళ్ళు</h1>
  </header>

  <div class="container">
    <h2>కొత్త అకౌంట్ క్రియేట్ చేయండి</h2>
    <form id="register-form">
      <div class="form-group">
        <label>పూర్తి పేరు (Full Name):</label>
        <input type="text" id="user-name" placeholder="మీ పేరు టైప్ చేయండి" required>
      </div>
      <div class="form-group">
        <label>ఫోన్ నంబర్ (10 అంకెలు):</label>
        <input type="tel" id="user-phone" placeholder="10 అంకెల ఫోన్ నంబర్" maxlength="10" required>
      </div>
      <div class="form-group">
        <label>పాస్‌వర్డ్ (Password):</label>
        <input type="password" id="user-pass" placeholder="పాస్‌వర్డ్ సెట్ చేసుకోండి" required>
      </div>
      <div class="form-group">
        <label>లొకేషన్ / అడ్రస్ (Location):</label>
        <input type="text" id="user-address" placeholder="మీ ఊరు / ఇంటి అడ్రస్" required>
      </div>
      <div class="form-group">
        <label>పిన్ కోడ్ (Pincode):</label>
        <input type="text" id="user-pincode" placeholder="6 అంకెల పిన్ కోడ్" maxlength="6" required>
      </div>
      <button type="submit">అకౌంట్ క్రియేట్ చేయండి</button>
    </form>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBFcLXUtPAbkrleJddY6PzGjNOXK3JeSwU",
      authDomain: "ammamma-pachadi.firebaseapp.com",
      databaseURL: "https://ammamma-pachadi-default-rtdb.firebaseio.com",
      projectId: "ammamma-pachadi",
      storageBucket: "ammamma-pachadi.firebasestorage.app",
      messagingSenderId: "139339162344",
      appId: "1:139339162344:web:b0b2f1cc23684973169f5d"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Form Submission
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('user-name').value.trim();
      const phone = document.getElementById('user-phone').value.trim();
      const password = document.getElementById('user-pass').value.trim();
      const address = document.getElementById('user-address').value.trim();
      const pincode = document.getElementById('user-pincode').value.trim();

      // Phone Number Validation (Must be exactly 10 digits)
      const phoneRegex = /^[0-9]{10}$/;
      if (!phoneRegex.test(phone)) {
        alert("దయచేసి సరైన 10 అంకెల ఫోన్ నంబర్ ఎంటర్ చేయండి!");
        return;
      }

      // Save Data to Firebase under 'users' Node using Phone Number as Key
      database.ref('users/' + phone).set({
        fullName: name,
        phoneNumber: phone,
        password: password,
        address: address,
        pincode: pincode,
        createdAt: new Date().toISOString()
      }, function(error) {
        if (error) {
          alert("అకౌంట్ క్రియేట్ చేయడంలో లోపం జరిగింది: " + error.message);
        } else {
          alert("🎉 అకౌంట్ విజయవంతంగా క్రియేట్ అయ్యింది!");
          document.getElementById('register-form').reset();
        }
      });
    });
  </script>
</body>
</html>
